<svg xmlns="http://www.w3.org/2000/svg" width="900" height="192" viewBox="0 0 900 192">
  <rect x="0" y="0" width="900" height="192" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="450" y="20" fill="{fg}" text-anchor="middle" font-size="12">容差如何叠加：标称值两侧分别累加</text>

    <!-- the tolerance limit on the side below nominal -->
    <path d="M168,40 V150" stroke="{muted}" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="168" y="164" fill="{muted}" text-anchor="middle">限值</text>

    <!-- below nominal, outward from it: DC drop, VRM accuracy, ripple, transient -->
    <rect x="410" y="92" width="110" height="26" fill="{fg}" fill-opacity="0.55"/>
    <rect x="335" y="92" width="75" height="26" fill="{muted}" fill-opacity="0.85"/>
    <rect x="285" y="92" width="50" height="26" fill="{accent}" fill-opacity="0.55"/>
    <rect x="195" y="92" width="90" height="26" fill="{warn}" fill-opacity="0.9"/>
    <g fill="{fg}" text-anchor="middle">
      <text x="465" y="134">DC 压降</text>
      <text x="372" y="134">VRM 精度</text>
      <text x="310" y="134">纹波</text>
      <text x="240" y="134">瞬态</text>
    </g>

    <!-- what each check adds -->
    <g stroke="{accent}" stroke-width="1.4" fill="none">
      <path d="M337,86 v-6 h181 v6"/>
      <path d="M197,86 v-6 h136 v6"/>
      <path d="M197,62 v-6 h321 v6"/>
    </g>
    <g fill="{accent}" text-anchor="middle">
      <text x="427" y="75">DC 合计 ≤ DC 容差</text>
      <text x="265" y="75">AC 合计 ≤ AC 容差</text>
      <text x="357" y="51">总计 ≤ 容差</text>
    </g>

    <!-- nominal -->
    <path d="M520,36 V150" stroke="{fg}" stroke-width="1.6"/>
    <text x="520" y="164" fill="{fg}" text-anchor="middle">标称值</text>
    <text x="358" y="150" fill="{muted}" text-anchor="middle">◀ 低于标称</text>

    <!-- above nominal: the same parts and checks -->
    <rect x="520" y="92" width="40" height="26" fill="{fg}" fill-opacity="0.3"/>
    <rect x="560" y="92" width="75" height="26" fill="{muted}" fill-opacity="0.5"/>
    <rect x="635" y="92" width="50" height="26" fill="{accent}" fill-opacity="0.3"/>
    <rect x="685" y="92" width="70" height="26" fill="{warn}" fill-opacity="0.55"/>
    <g fill="{muted}" text-anchor="middle">
      <text x="540" y="134">抬升</text>
      <text x="637" y="150">高于标称 ▶</text>
      <text x="637" y="75">同样的项和检查，</text>
      <text x="637" y="88">对应各容差的上限</text>
    </g>
    <path d="M772,40 V150" stroke="{muted}" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="772" y="164" fill="{muted}" text-anchor="middle">限值</text>

    <!-- the rules -->
    <g fill="{muted}">
      <text x="16" y="182">全部项已知时，每组容差都满足则通过；任一项超出即失败。多个开关电源的纹波：平方和根。</text>
    </g>
    <g fill="{fg}" font-size="10.5">
      <text x="16" y="44">DC 压降：DC 求解</text>
      <text x="16" y="60">VRM 精度：VRM 设置</text>
      <text x="16" y="76">纹波：噪声分析，在负载探针处</text>
      <text x="16" y="92">瞬态：AC，在探针处</text>
    </g>
    <g fill="{fg}" font-size="10.5" text-anchor="end">
      <text x="886" y="44">20 MHz 限制：纹波和</text>
      <text x="886" y="60">瞬态，如同示波器</text>
      <text x="886" y="76">通过其限制所示</text>
    </g>
  </g>
</svg>
